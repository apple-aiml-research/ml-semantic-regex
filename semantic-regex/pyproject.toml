[project]
name = "semantic-regex"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Auto-interpreting LLM features with a structured language"
keywords = ["interpretability", "autointerp", "semantic regex"]
readme = "README.md"
authors = [
  {name = "Angie Boggust", email = "aboggust@csail.mit.edu"},
  {name = "Donghao Ren", email = "donghao@apple.com"},
  {name = "Yannick Assogba", email = "yassogba@apple.com"},
  {name = "Dominik Moritz", email = "domoritz@apple.com"},
  {name = "Arvind Satyanarayan", email = "arvindsatya@mit.edu"},
  {name = "Fred Hohman", email = "fredhohman@apple.com"}
]
requires-python = ">=3.11"
dependencies = [
    "dspy>=3.0.0",
    "numpy>=2.3.0",
    "requests>=2.32.0",
]

[project.urls]
homepage = "https://apple.github.io/ml-semantic-regex"
source = "https://github.com/apple/ml-semantic-regex"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
